_root: C:\Users\T SAILOHITH\Desktop\SIH\RetinaGuard
augmentation:
  brightness_jitter: 0.2
  contrast_jitter: 0.2
  horizontal_flip: true
  random_crop_scale:
  - 0.85
  - 1.0
  rotation_degrees: 15
  saturation_jitter: 0.1
  vertical_flip: false
dataset:
  cache_dir: data/aptos_cache
  class_names:
  - No DR
  - Mild DR
  - Moderate DR
  - Severe DR
  - Proliferative DR
  name: bumbledeep/aptos
  num_classes: 5
  split_seed: 42
  val_fraction: 0.2
export:
  dynamic_axes: true
  opset_version: 17
inference:
  quality_threshold: 40
  uncertainty_threshold: 0.65
model:
  architecture: efficientnet_b0
  dropout: 0.3
  freeze_backbone_epochs: 5
  pretrained: true
paths:
  best_model: models/aptos_efficientnet/best_model.pt
  checkpoint_dir: models/aptos_efficientnet/checkpoints
  log_file: results/training.log
  model_dir: models/aptos_efficientnet
  onnx_model: models/aptos_efficientnet/best_model.onnx
  results_dir: results
  split_file: data/aptos_cache/split_indices.json
preprocessing:
  border_threshold: 10
  clahe_clip_limit: 2.0
  clahe_tile_grid: 8
  image_size: 224
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
training:
  batch_size: 32
  class_weighting: balanced
  early_stopping_patience: 7
  epochs: 30
  finetune_lr: 0.0001
  learning_rate: 0.001
  num_workers: 0
  optimizer: adam
  pin_memory: false
  scheduler: cosine
  seed: 42
  use_amp: false
  weight_decay: 0.0001
