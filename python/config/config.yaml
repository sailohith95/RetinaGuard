# RetinaGuard — Training & Model Configuration
# All hyperparameters in one place. No scattered magic numbers.

# ── Dataset ─────────────────────────────────────────────────────────────────
dataset:
  name: "bumbledeep/aptos"
  cache_dir: "data/aptos_cache"          # relative to RetinaGuard root
  split_seed: 42
  val_fraction: 0.20                     # 80/20 split
  num_classes: 5
  class_names:
    - "No DR"
    - "Mild DR"
    - "Moderate DR"
    - "Severe DR"
    - "Proliferative DR"

# ── Preprocessing ────────────────────────────────────────────────────────────
preprocessing:
  image_size: 224                        # EfficientNet-B0 native size
  mean: [0.485, 0.456, 0.406]           # ImageNet normalization
  std:  [0.229, 0.224, 0.225]
  clahe_clip_limit: 2.0
  clahe_tile_grid: 8
  border_threshold: 10                   # pixel value to detect black borders

# ── Augmentation (training only) ─────────────────────────────────────────────
augmentation:
  horizontal_flip: true
  vertical_flip: false
  rotation_degrees: 15
  brightness_jitter: 0.2
  contrast_jitter: 0.2
  saturation_jitter: 0.1
  random_crop_scale: [0.85, 1.0]

# ── Model ────────────────────────────────────────────────────────────────────
model:
  architecture: "efficientnet_b0"        # efficientnet_b0 | resnet50 | efficientnet_b2
  pretrained: true
  dropout: 0.3
  freeze_backbone_epochs: 5             # Stage 1: train head only

# ── Training ─────────────────────────────────────────────────────────────────
training:
  epochs: 30
  batch_size: 32
  num_workers: 0                         # 0 for Windows compatibility
  optimizer: "adam"                      # adam | sgd | adamw
  learning_rate: 1.0e-3                 # Stage 1 LR (head)
  finetune_lr: 1.0e-4                   # Stage 2 LR (backbone)
  weight_decay: 1.0e-4
  scheduler: "cosine"                   # cosine | step | plateau
  early_stopping_patience: 7
  class_weighting: "balanced"           # balanced | none | sqrt_inv
  seed: 42
  use_amp: false                         # Mixed precision (GPU only)
  pin_memory: false                      # false for CPU

# ── Output Paths ─────────────────────────────────────────────────────────────
paths:
  model_dir: "models/aptos_efficientnet"
  best_model: "models/aptos_efficientnet/best_model.pt"
  onnx_model: "models/aptos_efficientnet/best_model.onnx"
  results_dir: "results"
  checkpoint_dir: "models/aptos_efficientnet/checkpoints"
  split_file: "data/aptos_cache/split_indices.json"
  log_file: "results/training.log"

# ── Inference ────────────────────────────────────────────────────────────────
inference:
  uncertainty_threshold: 0.65           # Below this → warn uncertain
  quality_threshold: 40                 # Image quality score minimum

# ── ONNX Export ──────────────────────────────────────────────────────────────
export:
  opset_version: 17
  dynamic_axes: true                    # Allow variable batch size
